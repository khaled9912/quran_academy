            {w: "<span class='c-black'>أَوۡفُوا۟ ٱلۡكَيۡلَ وَلَا تَكُونُوا۟ مِنَ ٱلۡمُخۡسِرِينَ</span>", theme: "pink", t: "golden"},

            {w: "<span class='c-black'>وَلَا تَنَـٰزَعُوا۟ فَتَفۡشَلُوا۟ وَتَذۡهَبَ رِيحُكُمۡ</span>", theme: "pink", t: "speed"},
